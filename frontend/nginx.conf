server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Encaminha as chamadas à API REST do backend (Spring Boot) para o serviço
  # "backend" do docker-compose. O frontend hoje não faz essas chamadas via
  # código (ver README/Roadmap), mas o proxy já fica pronto para quando a
  # integração for feita, e é usado para validar a conectividade end-to-end.
  location /curriculo {
    proxy_pass http://backend:8080/curriculo;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
